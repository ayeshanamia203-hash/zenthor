<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">
<title>Zenthor</title>
<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
<!-- Font Awesome -->

<script
    defer

</script>

    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js">

<script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>

    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js">
</script>
<style>
/* ============================================================
   THEME
============================================================ */
:root[data-theme="dark"] {
    --bg-color:#131314;
    --sidebar-bg:#1e1e20;
    --text-color:#ffffff;
    --text-muted:#b8b8b8;
    --accent-color:#a8c7fa;
    --border-color:#2d2d30;
    --input-bg:#1e1e20;
    --input-border:#3c4043;
    --btn-hover:#2b2a33;
    --bubble-text:#ffffff;
    --strong-color:#a8c7fa;
    --modal-bg:#1e1e20;
    --menu-bg:#29292c;
}
:root[data-theme="light"] {
    --bg-color:#ffffff;
    --sidebar-bg:#f0f4f9;
    --text-color:#1f1f1f;
    --text-muted:#555555;
    --accent-color:#0b57d0;
    --border-color:#e1e3e1;
    --input-bg:#f0f4f9;
    --input-border:#c4c7c5;
    --btn-hover:#e3e3e3;
    --bubble-text:#1f1f1f;
    --strong-color:#0b57d0;
    --modal-bg:#ffffff;
    --menu-bg:#ffffff;
}
/* ============================================================
   GLOBAL
============================================================ */
* {
    box-sizing:border-box;
}
html,
body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg-color);
    color:var(--text-color);
    font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
}
body {
    display:flex;
}
/* ============================================================
   SIDEBAR
============================================================ */
.sidebar {
    width:260px;
    height:100%;
    background:var(--sidebar-bg);
    border-right:1px solid var(--border-color);
    padding:20px;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    transition:all .25s ease;
    z-index:1000;
}
.sidebar.collapsed {
    margin-left:-260px;
}
.sidebar-overlay {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:999;
}
.new-chat-btn {
    background:var(--input-bg);
    color:var(--text-color);
    border:1px solid var(--border-color);
    border-radius:30px;
    padding:10px 15px;
    font-weight:500;
    cursor:pointer;
}
.new-chat-btn:hover {
    background:var(--btn-hover);
}
.history-list {
    flex:1;
    overflow-y:auto;
    margin-top:15px;
}
.history-label {
    color:var(--text-muted);
    font-size:11px;
    font-weight:700;
    margin:15px 8px 8px;
}
.history-item {
    display:flex;
    align-items:center;
    padding:11px 12px;
    border-radius:10px;
    color:var(--text-muted);
    cursor:pointer;
    font-size:14px;
    margin-bottom:5px;
    user-select:none;
    position:relative;
}
.history-item:hover,
.history-item.active {
    background:var(--btn-hover);
    color:var(--text-color);
}
.history-title {
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    width:100%;
}
.pinned-icon {
    color:#f59e0b;
    margin-left:5px;
}
/* ============================================================
   CONTEXT MENU
============================================================ */
.chat-context-menu {
    display:none;
    position:fixed;
    min-width:190px;
    background:var(--menu-bg);
    border:1px solid var(--border-color);
    border-radius:13px;
    box-shadow:0 10px 35px rgba(0,0,0,.35);
    padding:7px;
    z-index:5000;
}
.chat-context-menu.show {
    display:block;
}
.context-item {
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:10px 12px;
    border:none;
    border-radius:8px;
    background:transparent;
    color:var(--text-color);
    text-align:left;
    cursor:pointer;
}
.context-item:hover {
    background:var(--btn-hover);
}
.context-item.delete {
    color:#ef4444;
}
.context-item i {
    width:18px;
}
/* ============================================================
   MAIN
============================================================ */
.main-chat {
    flex:1;
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
.chat-header {
    padding:15px 25px;
    border-bottom:1px solid var(--border-color);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
}
.header-left {
    display:flex;
    align-items:center;
}
.toggle-btn,
.theme-btn {
    background:transparent;
    border:none;
    color:var(--text-color);
    cursor:pointer;
    padding:7px 12px;
    border-radius:20px;
}
.toggle-btn:hover,
.theme-btn:hover {
    background:var(--btn-hover);
}
.theme-btn {
    border:1px solid var(--border-color);
}
/* ============================================================
   CHAT
============================================================ */
.chat-container {
    flex:1;
    overflow-y:auto;
    padding:20px;
    width:100%;
    max-width:900px;
    margin:0 auto;
}
.welcome-screen {
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}
.welcome-screen h2 {
    margin-bottom:0.5rem;
}
.welcome-screen .text-secondary {
    color:var(--text-muted);
}
.message {
    display:flex;
    margin-bottom:28px;
    gap:0;
}
.message.user {
    flex-direction: row-reverse;
}
.message.user .bubble {
    text-align: right;
    max-width: 88%;
}
.message.ai .bubble {
    text-align: left;
    max-width: 88%;
}
.bubble {
    width:100%;
    color:var(--bubble-text);
    font-size:16px;
    line-height:1.6;
    word-wrap:break-word;
}
.bubble strong {
    color:var(--strong-color);
}
.bubble table {
    width:100%;
    border-collapse:collapse;
    margin:12px 0;
}
.bubble th,
.bubble td {
    border:1px solid var(--border-color);
    padding:8px;
}
.bubble th {
    background:var(--btn-hover);
}
/* ============================================================
   IMAGE / PDF
============================================================ */
.uploaded-img-preview {
    display:block;
    max-width:350px;
    max-height:500px;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:12px;
    border:1px solid var(--border-color);
    margin-bottom:10px;
}
.pdf-badge {
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--btn-hover);
    border:1px solid #e11d48;
    color:#ff4d4d;
    padding:7px 12px;
    border-radius:8px;
}
/* ============================================================
   CODE
============================================================ */
.code-container {
    margin:12px 0;
    border-radius:8px;
    overflow:hidden;
    border:1px solid #3e4451;
    background:#282c34;
}
.code-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#21252b;
    padding:6px 12px;
    font-size:12px;
    color:#abb2bf;
}
pre {
    margin:0 !important;
    padding:12px !important;
    overflow-x:auto;
}
.copy-code-btn {
    background:#3e4451;
    color:white;
    border:none;
    border-radius:4px;
    padding:3px 8px;
    font-size:12px;
    cursor:pointer;
}
/* ============================================================
   INPUT
============================================================ */
.input-container-box {
    width:100%;
    padding:10px 15px 15px;
    background:var(--bg-color);
    flex-shrink:0;
}
.input-wrapper {
    width:100%;
    max-width:850px;
    margin:0 auto;
    background:var(--input-bg);
    border:1px solid var(--input-border);
    border-radius:24px;
    padding:8px 15px;
}
#filePreviewArea {
    display:none;
    position:relative;
    width:fit-content;
    margin-bottom:8px;
}
#previewImgThumb {
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:12px;
}
#pdfPreviewThumb {
    display:none;
    background:var(--btn-hover);
    border:1px solid #e11d48;
    color:#ff4d4d;
    padding:8px 12px;
    border-radius:10px;
    font-size:13px;
}
.close-img-btn {
    position:absolute;
    top:-7px;
    right:-7px;
    width:22px;
    height:22px;
    border:none;
    border-radius:50%;
    background:#e11d48;
    color:white;
    cursor:pointer;
}
.input-row {
    display:flex;
    align-items:center;
    gap:10px;
}
.plus-btn {
    background:none;
    border:none;
    color:var(--accent-color);
    font-size:18px;
    cursor:pointer;
    padding:5px;
}
.plus-btn:hover {
    opacity:.8;
}
.chat-textarea {
    background:transparent;
    border:none;
    outline:none;
    color:var(--text-color);
    width:100%;
    resize:none;
    min-height:28px;
    max-height:120px;
    padding:6px 0;
    font-size:15px;
    font-family:inherit;
}
.chat-textarea:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.chat-textarea::placeholder {
    color:var(--text-muted);
}
/* ============================================================
   MIC BUTTON
============================================================ */
.mic-btn {
    background:none;
    border:none;
    color:var(--accent-color);
    font-size:18px;
    cursor:pointer;
    padding:5px;
}
.mic-btn:hover {
    opacity:.8;
}
.mic-btn.recording {
    color:#ef4444 !important;
    animation:pulse 1.2s infinite;
}
@keyframes pulse {
    0% { transform:scale(1); }
    50% { transform:scale(1.2); }
    100% { transform:scale(1); }
}
/* ============================================================
   SEND BUTTON
============================================================ */
.send-btn {
    width:46px;
    height:46px;
    min-width:46px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    background:var(--text-color);
    color:var(--bg-color);
    transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
}
.send-btn:hover:not(:disabled) {
    transform:scale(1.05);
}
.send-btn:disabled {
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}
/* ============================================================
   MODAL
============================================================ */
.modal-content {
    background:var(--modal-bg);
    color:var(--text-color);
    border:1px solid var(--border-color);
}
.modal-btn {
    width:100%;
    padding:15px;
    margin-bottom:10px;
    border-radius:15px;
    border:1px solid var(--border-color);
    background:var(--input-bg);
    color:var(--text-color);
    text-align:left;
    cursor:pointer;
}
.modal-btn:hover {
    background:var(--btn-hover);
}
/* ============================================================
   MOBILE
============================================================ */
@media(max-width:768px) {
    .sidebar {
        position:absolute;
        top:0;
        bottom:0;
        left:0;
        box-shadow:5px 0 15px rgba(0,0,0,.3);
    }
    .sidebar.collapsed {
        margin-left:-260px;
    }
    .sidebar-overlay.active {
        display:block;
    }
    .chat-container {
        padding:15px 10px;
    }
    .chat-header {
        padding:12px 15px;
    }
    .message.user .bubble,
    .message.ai .bubble {
        max-width:100%;
    }
    .uploaded-img-preview {
        max-width:280px;
    }
}
</style>
</head>
<body>
<!-- ============================================================
     SIDEBAR OVERLAY
============================================================ -->
<div
    class="sidebar-overlay"
    id="sidebarOverlay"
    onclick="toggleSidebar()">
</div>
<!-- ============================================================
     SIDEBAR
============================================================ -->
<div
    class="sidebar"
    id="sidebar">
    <div
        class="d-flex justify-content-between align-items-center mb-3 d-md-none">
        <span class="fw-bold">Menu</span>
        <button
            class="btn btn-sm text-secondary"
            onclick="toggleSidebar()">
            <i class="fa-solid fa-xmark fa-xl"></i>
        </button>
    </div>
    <button
        class="new-chat-btn w-100 mb-2"
        onclick="startNewChat()">
        <i class="fa-solid fa-plus me-2"></i>
        New Chat
    </button>
    <div
        class="history-list"
        id="historyList">
    </div>
</div>
<!-- ============================================================
     MAIN
============================================================ -->
<div class="main-chat">
    <!-- HEADER -->
    <div class="chat-header">
        <div class="header-left">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h5 class="m-0 fw-bold">
                <i class="fa-solid fa-sparkles me-2 text-warning"></i>
                Zenthor
            </h5>
        </div>
        <button
            class="theme-btn"
            onclick="toggleTheme()"
            id="themeToggleBtn">
            <i class="fa-solid fa-sun" id="themeIcon"></i>
            <span id="themeText">Light</span>
        </button>
    </div>
    <!-- CHAT -->
    <div class="chat-container" id="chatBox"></div>
    <!-- INPUT -->
    <div class="input-container-box">
        <div class="input-wrapper">
            <div id="filePreviewArea">
                <img id="previewImgThumb" src="" alt="Image preview" style="display:none;">
                <div id="pdfPreviewThumb">
                    <i class="fa-solid fa-file-pdf me-2"></i>
                    <span id="pdfFileName">document.pdf</span>
                </div>
                <button class="close-img-btn" onclick="clearSelectedFile()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="input-row">
                <button
                    class="plus-btn"
                    data-bs-toggle="modal"
                    data-bs-target="#uploadModal"
                    type="button">
                    <i class="fa-solid fa-circle-plus"></i>
                </button>
                <form id="chatForm" class="d-flex w-100 align-items-center gap-2">
                    <textarea
                        id="question"
                        class="chat-textarea"
                        rows="1"
                        placeholder="Ask anything"></textarea>
                    <button
                        type="button"
                        class="mic-btn"
                        id="micBtn"
                        onclick="toggleVoiceRecording()"
                        title="Voice to text">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button
                        type="button"
                        class="send-btn"
                        id="sendBtn"
                        onclick="handleSend()"
                        title="Send">
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- ============================================================
     CONTEXT MENU
============================================================ -->
<div class="chat-context-menu" id="chatContextMenu">
    <button class="context-item" onclick="contextPin()">
        <i class="fa-solid fa-thumbtack"></i>
        <span id="contextPinText">Pin</span>
    </button>
    <button class="context-item" onclick="contextRename()">
        <i class="fa-solid fa-pen"></i> Rename
    </button>
    <button class="context-item delete" onclick="contextDelete()">
        <i class="fa-solid fa-trash"></i> Delete
    </button>
</div>
<!-- ============================================================
     FILE INPUTS
============================================================ -->
<input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="handleFileSelect(this)">
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleFileSelect(this)">
<input type="file" id="pdfInput" accept="application/pdf" style="display:none" onchange="handleFileSelect(this)">
<!-- ============================================================
     UPLOAD MODAL
============================================================ -->
<div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-paperclip me-2 text-primary"></i>Attach File</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <button class="modal-btn" onclick="triggerCamera()">
                    <i class="fa-solid fa-camera fa-lg me-3 text-warning"></i>
                    <strong>Take Photo</strong>
                </button>
                <button class="modal-btn" onclick="triggerGallery()">
                    <i class="fa-solid fa-images fa-lg me-3 text-info"></i>
                    <strong>Upload Photo</strong>
                </button>
                <button class="modal-btn" onclick="triggerPDF()">
                    <i class="fa-solid fa-file-pdf fa-lg me-3 text-danger"></i>
                    <strong>Upload PDF Document</strong>
                </button>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
<script>
/* ============================================================
   VARIABLES
============================================================ */
let selectedFile = null;
let selectedFileDataURL = null;
let contextSessionId = null;
let longPressTimer = null;
const questionInput = document.getElementById("question");
const chatBox = document.getElementById("chatBox");
const historyList = document.getElementById("historyList");
const micBtn = document.getElementById("micBtn");
/* ============================================================
   DATABASE
============================================================ */
const DB_NAME = "Zenthor_DB";
const DB_VERSION = 1;
const STORE_NAME = "sessions";
let db = null;
let allSessions = {};
let currentSessionId = localStorage.getItem("zenthor_current_session_id") || null;
/* ============================================================
   OPEN DATABASE
============================================================ */
function openDatabase(){
    return new Promise(function(resolve,reject){
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = function(event){
            const database = event.target.result;
            if(!database.objectStoreNames.contains(STORE_NAME)){
                database.createObjectStore(STORE_NAME, { keyPath:"id" });
            }
        };
        request.onsuccess = function(event){
            db = event.target.result;
            resolve(db);
        };
        request.onerror = function(){
            reject(request.error);
        };
    });
}
/* ============================================================
   LOAD SESSIONS
============================================================ */
function loadAllSessions(){
    return new Promise(function(resolve,reject){
        if(!db){ resolve({}); return; }
        const transaction = db.transaction(STORE_NAME, "readonly");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = function(){
            const sessions = {};
            (request.result || []).forEach(function(session){
                sessions[session.id] = session;
            });
            resolve(sessions);
        };
        request.onerror = function(){
            reject(request.error);
        };
    });
}
/* ============================================================
   SAVE / DELETE SESSION
============================================================ */
function saveSession(session){
    return new Promise(function(resolve,reject){
        if(!db || !session || !session.id){ resolve(); return; }
        const transaction = db.transaction(STORE_NAME, "readwrite");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.put(session);
        request.onsuccess = function(){ resolve(); };
        request.onerror = function(){ reject(request.error); };
    });
}
function deleteSessionFromDB(id){
    return new Promise(function(resolve,reject){
        if(!db){ resolve(); return; }
        const transaction = db.transaction(STORE_NAME, "readwrite");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.delete(id);
        request.onsuccess = function(){ resolve(); };
        request.onerror = function(){ reject(request.error); };
    });
}
/* ============================================================
   DEFAULT WELCOME
============================================================ */
const DEFAULT_WELCOME = `
<div class="welcome-screen" id="welcomeScreen">
    <h2 class="fw-bold mb-2">Hello there!</h2>
    <p class="text-secondary fs-5">How can I help you today?</p>
    <small class="text-secondary">Ask me anything — study, coding, writing, ideas, math, science, technology and more.</small>
</div>
`;
/* ============================================================
   THEME
============================================================ */
function initTheme(){
    const savedTheme = localStorage.getItem("zenthor_theme") || "dark";
    setTheme(savedTheme);
}
function toggleTheme(){
    const current = document.documentElement.getAttribute("data-theme");
    setTheme(current === "dark" ? "light" : "dark");
}
function setTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("zenthor_theme", theme);
    const icon = document.getElementById("themeIcon");
    const text = document.getElementById("themeText");
    if(theme === "light"){
        icon.className = "fa-solid fa-moon";
        text.innerText = "Dark";
    }else{
        icon.className = "fa-solid fa-sun";
        text.innerText = "Light";
    }
}
/* ============================================================
   SIDEBAR
============================================================ */
function toggleSidebar(){
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    sidebar.classList.toggle("collapsed");
    if(window.innerWidth <= 768){
        if(!sidebar.classList.contains("collapsed")){
            overlay.classList.add("active");
        }else{
            overlay.classList.remove("active");
        }
    }
}
function mobileSidebarCheck(){
    if(window.innerWidth <= 768){
        document.getElementById("sidebar").classList.add("collapsed");
        document.getElementById("sidebarOverlay").classList.remove("active");
    }
}
/* ============================================================
   INITIALIZATION
============================================================ */
window.addEventListener("DOMContentLoaded", async function(){
    initTheme();
    mobileSidebarCheck();
    try{
        await openDatabase();
        allSessions = await loadAllSessions();
    }catch(error){
        console.error("Database initialization failed:", error);
        allSessions = {};
    }
    if(currentSessionId && allSessions[currentSessionId]){
        renderSidebarHistory();
        loadSession(currentSessionId);
    }else{
        startNewChat(true);
    }
});
/* ============================================================

/* ============================================================
   UTILITY FUNCTIONS
============================================================ */
function escapeHTML(text){
    const div = document.createElement("div");
    div.innerText = text || "";
    return div.innerHTML;
}
/* ============================================================
   DYNAMIC LOCAL RESET TIME (Global Timezone Support)
============================================================ */
function getLocalResetTime() {
    // Server resets at 00:00 UTC daily.
    // Show this UTC moment in the user's local timezone.
    const now = new Date();
    const utcReset = new Date(Date.UTC(
        now.getUTCFullYear(),
        now.getUTCMonth(),
        now.getUTCDate() + 1,
        0, 0, 0
    ));

    // Format in user's local time
    const timeStr = utcReset.toLocaleString(undefined, {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
    });

    // Check if reset happens today or tomorrow in user's local time
    const localToday = new Date();
    const localResetDay = utcReset.getDate();
    const localTodayDay = localToday.getDate();
    const dayLabel = (localResetDay === localTodayDay) ? "today" : "tomorrow";

    return `${timeStr} ${dayLabel}`;
}

function renderMath(element){
    if(window.renderMathInElement){
        try{
            renderMathInElement(element, {
                delimiters:[
                    { left:"$$", right:"$$", display:true },
                    { left:"$", right:"$", display:false },
                    { left:"\\(", right:"\\)", display:false },
                    { left:"\\[", right:"\\]", display:true }
                ],
                throwOnError:false
            });
        }catch(error){ console.warn("Math render error:", error); }
    }
}
function processCodeBlocks(element){
    if(!element) return;
    element.querySelectorAll("pre").forEach(function(pre){
        if(pre.closest(".code-container")) return;
        const code = pre.querySelector("code");
        const codeText = code ? code.innerText : pre.innerText;
        let language = "code";
        if(code && code.className){
            const match = code.className.match(/language-(\w+)/);
            if(match) language = match[1];
        }
        const container = document.createElement("div");
        container.className = "code-container";
        const header = document.createElement("div");
        header.className = "code-header";
        const label = document.createElement("span");
        label.innerText = language;
        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-code-btn";
        copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
        copyBtn.onclick = async function(){
            try{
                await navigator.clipboard.writeText(codeText.trim());
                copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
                setTimeout(function(){
                    copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
                }, 2000);
            }catch(error){ console.error("Copy error:", error); }
        };
        header.appendChild(label);
        header.appendChild(copyBtn);
        pre.parentNode.insertBefore(container, pre);
        container.appendChild(header);
        container.appendChild(pre);
        if(window.hljs && code){
            try{ hljs.highlightElement(code); } catch(error){}
        }
    });
}
/* ============================================================
   INPUT ENABLE/DISABLE (LIMIT HANDLING - WITH SAVED STATE)
============================================================ */
function disableInputs() {
    document.getElementById("sendBtn").disabled = true;
    document.getElementById("question").disabled = true;
    document.getElementById("question").placeholder = "⏳ Limit reached. Come back tomorrow!";
    document.getElementById("sendBtn").innerHTML = '<i class="fa-solid fa-lock"></i>';
    
    if (allSessions[currentSessionId]) {
        allSessions[currentSessionId].locked = true;
        saveSession(allSessions[currentSessionId]);
    }
}
function enableInputs() {
    document.getElementById("sendBtn").disabled = false;
    document.getElementById("question").disabled = false;
    document.getElementById("question").placeholder = "Ask anything";
    document.getElementById("sendBtn").innerHTML = '<i class="fa-solid fa-arrow-up"></i>';
    
    if (allSessions[currentSessionId]) {
        allSessions[currentSessionId].locked = false;
        saveSession(allSessions[currentSessionId]);
    }
}
/* ============================================================
   NEW CHAT
============================================================ */
function startNewChat(render = true){
    currentSessionId = "session_" + Date.now() + "_" + Math.random().toString(36).substring(2,9);
    allSessions[currentSessionId] = {
        id: currentSessionId,
        title: "New Chat",
        html: DEFAULT_WELCOME,
        isPinned: false,
        locked: false,
        createdAt: Date.now(),
        updatedAt: Date.now()
    };
    localStorage.setItem("zenthor_current_session_id", currentSessionId);
    saveSession(allSessions[currentSessionId]);
    if(render){
        renderSidebarHistory();
        loadSession(currentSessionId);
    }
    mobileSidebarCheck();
}
/* ============================================================
   LOAD SESSION (Checks the locked state per chat)
============================================================ */
function loadSession(id){
    if(!allSessions[id]) return;
    
    currentSessionId = id;
    localStorage.setItem("zenthor_current_session_id", currentSessionId);
    chatBox.innerHTML = allSessions[id].html || DEFAULT_WELCOME;
    
    if (allSessions[id].locked) {
        disableInputs();
    } else {
        enableInputs();
    }
    
    chatBox.querySelectorAll(".bubble").forEach(function(bubble){
        renderMath(bubble);
        processCodeBlocks(bubble);
    });
    chatBox.scrollTop = chatBox.scrollHeight;
    renderSidebarHistory();
    mobileSidebarCheck();
}
/* ============================================================
   DELETE SESSION
============================================================ */
async function deleteSession(event, id){
    if(event) event.stopPropagation();
    if(!allSessions[id]) return;
    if(!confirm("Delete this chat?")) return;
    delete allSessions[id];
    await deleteSessionFromDB(id);
    const keys = Object.keys(allSessions);
    if(currentSessionId === id){
        if(keys.length){
            keys.sort(function(a,b){ return (allSessions[b].updatedAt || 0) - (allSessions[a].updatedAt || 0); });
            currentSessionId = keys[0];
        }else{
            startNewChat(false);
        }
    }
    if(currentSessionId){
        localStorage.setItem("zenthor_current_session_id", currentSessionId);
    }
    renderSidebarHistory();
    loadSession(currentSessionId);
}
/* ============================================================
   PIN / RENAME
============================================================ */
function togglePin(event, id){
    if(event) event.stopPropagation();
    if(allSessions[id]){
        allSessions[id].isPinned = !allSessions[id].isPinned;
        saveSession(allSessions[id]);
        renderSidebarHistory();
    }
}
function renameSession(id){
    if(!allSessions[id]) return;
    const oldTitle = allSessions[id].title || "New Chat";
    const newTitle = prompt("Rename chat:", oldTitle);
    if(newTitle === null) return;
    const cleanTitle = newTitle.trim();
    if(!cleanTitle) return;
    allSessions[id].title = cleanTitle.substring(0, 80);
    saveSession(allSessions[id]);
    renderSidebarHistory();
}
/* ============================================================
   SIDEBAR HISTORY
============================================================ */
function renderSidebarHistory(){
    historyList.innerHTML = "";
    const keys = Object.keys(allSessions).sort(function(a,b){
        return (allSessions[b].updatedAt || 0) - (allSessions[a].updatedAt || 0);
    });
    const pinned = keys.filter(function(id){ return allSessions[id].isPinned; });
    const recent = keys.filter(function(id){ return !allSessions[id].isPinned; });
    if(pinned.length){
        historyList.innerHTML += `<div class="history-label">PINNED</div>`;
        pinned.forEach(function(id){ renderHistoryItem(id); });
    }
    if(recent.length){
        historyList.innerHTML += `<div class="history-label">RECENT CHATS</div>`;
        recent.forEach(function(id){ renderHistoryItem(id); });
    }
}
function renderHistoryItem(id){
    const session = allSessions[id];
    const active = id === currentSessionId ? "active" : "";
    const item = document.createElement("div");
    item.className = "history-item " + active;
    item.dataset.id = id;
    item.innerHTML = `
        <div class="history-title">
            <i class="fa-regular fa-message me-2"></i>
            ${escapeHTML(session.title || "New Chat")}
            ${session.isPinned ? '<i class="fa-solid fa-thumbtack pinned-icon"></i>' : ''}
        </div>
    `;
    item.addEventListener("click", function(){ loadSession(id); });
    item.addEventListener("contextmenu", function(e){
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, id);
    });
    item.addEventListener("touchstart", function(e){
        const touch = e.touches[0];
        longPressTimer = setTimeout(function(){
            showContextMenu(touch.clientX, touch.clientY, id);
        }, 600);
    }, { passive: true });
    item.addEventListener("touchend", function(){ clearTimeout(longPressTimer); });
    item.addEventListener("touchmove", function(){ clearTimeout(longPressTimer); });
    historyList.appendChild(item);
}
/* ============================================================
   CONTEXT MENU
============================================================ */
function showContextMenu(x, y, id){
    contextSessionId = id;
    const menu = document.getElementById("chatContextMenu");
    const pinText = document.getElementById("contextPinText");
    pinText.innerText = allSessions[id] && allSessions[id].isPinned ? "Unpin" : "Pin";
    menu.classList.add("show");
    const width = 190, height = 145;
    const safeX = Math.min(x, window.innerWidth - width - 10);
    const safeY = Math.min(y, window.innerHeight - height - 10);
    menu.style.left = Math.max(10, safeX) + "px";
    menu.style.top = Math.max(10, safeY) + "px";
}
function hideContextMenu(){
    document.getElementById("chatContextMenu").classList.remove("show");
    contextSessionId = null;
}
document.addEventListener("click", function(e){
    const menu = document.getElementById("chatContextMenu");
    if(!menu.contains(e.target)) hideContextMenu();
});
function contextPin(){
    if(contextSessionId){ togglePin(null, contextSessionId); }
    hideContextMenu();
}
function contextRename(){
    if(contextSessionId){ renameSession(contextSessionId); }
    hideContextMenu();
}
function contextDelete(){
    if(contextSessionId){ deleteSession(null, contextSessionId); }
    hideContextMenu();
}
/* ============================================================
   FILE HANDLING
============================================================ */
function closeUploadModal(){
    const modal = document.getElementById("uploadModal");
    const instance = bootstrap.Modal.getInstance(modal);
    if(instance) instance.hide();
}
function triggerCamera(){ closeUploadModal(); document.getElementById("cameraInput").click(); }
function triggerGallery(){ closeUploadModal(); document.getElementById("galleryInput").click(); }

function fileToDataURL(file){
    return new Promise(function(resolve,reject){
        const reader = new FileReader();
        reader.onload = function(){ resolve(reader.result); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}
async function handleFileSelect(input){
    if(!input.files || !input.files[0]) return;
    selectedFile = input.files[0];
    try{
        selectedFileDataURL = await fileToDataURL(selectedFile);
    }catch(error){
        selectedFileDataURL = null;
    }
    const previewArea = document.getElementById("filePreviewArea");
    const imageThumb = document.getElementById("previewImgThumb");
    const pdfThumb = document.getElementById("pdfPreviewThumb");
    if(selectedFile.type === "application/pdf"){
        imageThumb.style.display = "none";
        pdfThumb.style.display = "inline-block";
        document.getElementById("pdfFileName").innerText = selectedFile.name;
    }else{
        pdfThumb.style.display = "none";
        imageThumb.style.display = "block";
        imageThumb.src = selectedFileDataURL || URL.createObjectURL(selectedFile);
    }
    previewArea.style.display = "block";
}
function clearSelectedFile(){
    selectedFile = null;
    selectedFileDataURL = null;
    document.getElementById("galleryInput").value = "";
    document.getElementById("cameraInput").value = "";
    document.getElementById("pdfInput").value = "";
    document.getElementById("filePreviewArea").style.display = "none";
    document.getElementById("previewImgThumb").src = "";
}
/* ============================================================
   MICROPHONE (Voice to Text)
============================================================ */
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
async function toggleVoiceRecording(){
    if(isRecording){ stopRecording(); } else { startRecording(); }
}
async function startRecording(){
    try{
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = createCompatibleRecorder(stream);
        if(!mediaRecorder){
            stream.getTracks().forEach(function(track){ track.stop(); });
            alert("Audio recording is not supported on this browser.");
            return;
        }
        audioChunks = [];
        mediaRecorder.ondataavailable = function(event){
            if(event.data.size > 0) audioChunks.push(event.data);
        };
        mediaRecorder.onstop = async function(){
            const mimeType = mediaRecorder.mimeType || "audio/webm";
            const blob = new Blob(audioChunks, { type: mimeType });
            stream.getTracks().forEach(function(track){ track.stop(); });
            await transcribeAudio(blob);
        };
        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add("recording");
        questionInput.placeholder = "Recording... Tap microphone to stop";
    }catch(error){
        console.error("Microphone error:", error);
        alert("Microphone permission denied or unavailable.");
    }
}
function createCompatibleRecorder(stream){
    if(!window.MediaRecorder) return null;
    const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/aac"];
    for(const type of types){
        try{
            if(MediaRecorder.isTypeSupported(type)){
                return new MediaRecorder(stream, { mimeType: type });
            }
        }catch(error){}
    }
    try{ return new MediaRecorder(stream); } catch(error){ return null; }
}
function stopRecording(){
    if(mediaRecorder && isRecording){
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove("recording");
        questionInput.placeholder = "Processing voice...";
    }
}
async function transcribeAudio(blob){
    const formData = new FormData();
    formData.append("audio", blob, "audio.webm");
    try{
        const response = await fetch("/api/transcribe", { method:"POST", body:formData });
        const data = await response.json();
        if(data.status === "success" && data.text){
            questionInput.value = data.text;
            questionInput.style.height = "auto";
            questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + "px";
        }else{
            alert(data.message || "Voice recognition failed.");
        }
    }catch(error){
        console.error("Transcription error:", error);
        alert("Could not connect to voice service.");
    }finally{
        questionInput.placeholder = "Ask anything";
    }
}
/* ============================================================
   HANDLE SEND
============================================================ */
function handleSend(){
    const text = questionInput.value.trim();
    if(!text && !selectedFile) return;
    document.getElementById("chatForm").dispatchEvent(new Event("submit"));
}
/* ============================================================
   CHAT SEND (With Dynamic Timezone Limit UI)
============================================================ */
document.getElementById("chatForm").addEventListener("submit", async function(e){
    e.preventDefault();
    const question = questionInput.value.trim();
    if(!question && !selectedFile) return;

    // Remove welcome screen
    const welcomeEl = document.getElementById("welcomeScreen");
    if(welcomeEl) chatBox.innerHTML = "";

    const sendBtn = document.getElementById("sendBtn");
    const messageSessionId = currentSessionId;
    
    // Build user message HTML
    let userHTML = "";
    if(question){
        userHTML += `<strong>You</strong><br>${escapeHTML(question).replace(/\n/g, "<br>")}`;
    }
    if(selectedFile){
        if(selectedFile.type === "application/pdf"){
            userHTML = `<div class="pdf-badge"><i class="fa-solid fa-file-pdf"></i> ${escapeHTML(selectedFile.name)}</div>` + (userHTML ? "<br>" + userHTML : "");
        }else{
            const imageSrc = selectedFileDataURL || URL.createObjectURL(selectedFile);
            userHTML = `<img src="${imageSrc}" class="uploaded-img-preview" alt="Uploaded image">` + (userHTML ? "<br>" + userHTML : "");
        }
    }
    chatBox.innerHTML += `<div class="message user"><div class="bubble">${userHTML}</div></div>`;

    // Form data
    const formData = new FormData();
    formData.append("question", question);
    formData.append("session_id", messageSessionId);
    if(selectedFile) formData.append("file", selectedFile);

    // Title check
    const shouldGenerateTitle = allSessions[messageSessionId] && allSessions[messageSessionId].title === "New Chat";
    const titleQuestion = question || (selectedFile ? "Image or document analysis" : "");

    // Clear input
    questionInput.value = "";
    questionInput.style.height = "auto";
    clearSelectedFile();
    sendBtn.disabled = true;
    chatBox.scrollTop = chatBox.scrollHeight;

    // Loading
    const loadingId = "loading-" + Date.now();
    chatBox.innerHTML += `<div class="message ai" id="${loadingId}"><div class="bubble text-secondary"><i class="fa-solid fa-circle-notch fa-spin me-2"></i>Thinking...</div></div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    try{
        const response = await fetch("/api/chat", { method:"POST", body:formData });
        const data = await response.json();
        const loading = document.getElementById(loadingId);
        
        if(data.status === "success"){
            let content = data.response || "";
            try{ content = marked.parse(content); } catch(error){ content = escapeHTML(data.response).replace(/\n/g, "<br>"); }
            if(loading){
                const bubble = loading.querySelector(".bubble");
                bubble.classList.remove("text-secondary");
                bubble.innerHTML = `<div class="d-flex justify-content-between align-items-center mb-1"><strong>Zenthor</strong></div><div>${content}</div>`;
                processCodeBlocks(bubble);
                renderMath(bubble);
            }
            if(allSessions[messageSessionId]){
                allSessions[messageSessionId].html = chatBox.innerHTML;
                allSessions[messageSessionId].updatedAt = Date.now();
                await saveSession(allSessions[messageSessionId]);
            }
            if(shouldGenerateTitle && titleQuestion){
                generateTitle(titleQuestion, messageSessionId);
            }
        } else {
            if(loading){
                const bubble = loading.querySelector(".bubble");
                bubble.classList.remove("text-secondary");
                // Check if it's a limit error
                const isLimitError = data.is_limit_error === true || (data.message && (data.message.includes("limit") || data.message.includes("reached")));
                if(isLimitError){
                    // 🌍 Global Dynamic Timezone Limit Box
                    bubble.innerHTML = `
                        <div style="background: #fff3cd; border: 1px solid #ffc107; border-radius: 12px; padding: 16px; color: #856404; text-align: center; width: 100%;">
                            <div style="font-size: 28px; margin-bottom: 6px;">⏳</div>
                            <strong style="font-size: 16px;">Daily Limit Reached</strong>
                            <p style="margin: 8px 0 4px 0; font-size: 14px;">
                                ${escapeHTML(data.message || "You have used all your free questions for today.")}
                            </p>
                            <small style="font-size: 12px; opacity: 0.8;">🔄 Resets at <b>${getLocalResetTime()}</b> (your local time)</small>
                        </div>
                    `;
                    disableInputs();
                } else {
                    // Normal error
                    bubble.innerHTML = `<span class="text-danger">Error: ${escapeHTML(data.message || "Something went wrong.")}</span>`;
                }
            }
        }
    } catch(error){
        console.error("Chat error:", error);
        const loading = document.getElementById(loadingId);
        if(loading){
            loading.querySelector(".bubble").innerHTML = `<span class="text-danger">Server connection error.</span>`;
        }
    } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
    }
});
/* ============================================================
   AI AUTOMATIC CHAT TITLE
============================================================ */
async function generateTitle(prompt, sessionId){
    if(!prompt || !prompt.trim() || !sessionId) return;
    try{
        const formData = new FormData();
        formData.append("prompt", prompt.trim());
        formData.append("session_id", sessionId);
        const response = await fetch("/api/generate-title", { method:"POST", body:formData });
        if(!response.ok){ console.error("Title API error:", response.status); return; }
        const data = await response.json();
        if(data.status !== "success" || !data.title || !allSessions[sessionId]) return;
        let title = String(data.title).trim().replace(/^["'“”‘’]+/, "").replace(/["'“”‘’]+$/, "").trim();
        title = title.replace(/\s+/g, " ").trim();
        if(title.length > 60) title = title.substring(0,60).trim();
        if(!title) return;
        if(allSessions[sessionId].title !== "New Chat") return;
        allSessions[sessionId].title = title;
        allSessions[sessionId].updatedAt = Date.now();
        await saveSession(allSessions[sessionId]);
        renderSidebarHistory();
    } catch(error){ console.error("Automatic chat title generation error:", error); }
}
